[package]
name = "pipeline-strategy-interface"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Wire types, discriminators and fee maths for Pipeline strategy programs"

[dependencies]
borsh = { version = "1.5", features = ["derive"] }

[dev-dependencies]
proptest = "1"
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(kani_full)'] }
