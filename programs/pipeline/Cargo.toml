[package]
name = "pipeline"
version = "0.1.0"
publish = false
edition = "2021"
license-file = "LICENSE"
description = "Pipeline router: registry, swaps and fees for permissionless strategy programs"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
no-log-ix-name = []

[dependencies]
anchor-lang = { version = "=1.2.2", features = ["event-cpi"] }
pipeline-strategy-interface = { path = "../pipeline-strategy-interface" }
