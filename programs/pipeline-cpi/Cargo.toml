[package]
name = "pipeline-cpi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Call the Pipeline router from an on-chain program: build and invoke swaps and routes, and read their results"
repository = "https://github.com/MetalLegBob/pipeline"
homepage = "https://github.com/MetalLegBob/pipeline"
readme = "README.md"
keywords = ["solana", "pipeline", "amm", "defi", "cpi"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]

[features]
default = []
# Helpers that take Anchor's `CpiContext`.
anchor = ["dep:anchor-lang"]

[dependencies]
pipeline-strategy-interface = { path = "../pipeline-strategy-interface", version = "0.1.1" }
solana-program = "3.0.0"
anchor-lang = { version = "1.2.2", optional = true }

[dev-dependencies]
# Checks that the instructions built here match the off-chain builders byte for byte.
borsh = "1.5"
pipeline-client = { path = "../../crates/pipeline-client" }
