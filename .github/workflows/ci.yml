name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      # Test binaries link every Solana crate; without debug info they're a fraction of
      # the size, which keeps the runner's disk from filling up.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Cache cargo and Solana tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-build-sbf
            ~/.cargo/bin/cargo-test-sbf
            ~/.cache/solana
            target
            programs/target
          key: ${{ runner.os }}-pipeline-v3-${{ hashFiles('Cargo.lock', 'programs/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-pipeline-v3-

      - name: No keypairs in the repository
        run: scripts/check-no-keypairs.sh

      - name: Install cargo-build-sbf (sBPF v3 toolchain)
        # The cache may already hold the binary; reinstall only if the version differs.
        run: |
          if ! cargo build-sbf --version 2>/dev/null | grep -q "4.6.0"; then
            cargo install cargo-build-sbf --version 4.6.0 --locked --force
          fi

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          (cd programs && cargo fmt --all -- --check)

      - name: Build on-chain programs (one at a time, as solana-verify builds them)
        run: scripts/build-programs.sh

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Strategy template (build and test against these sources)
        run: scripts/test-template.sh

      - name: Strategy generator
        run: scripts/test-new-strategy.sh

  verification:
    # Formal proofs of the router's maths: Z3 for the fee arithmetic over every 64-bit
    # input, Kani for the settlement logic and everything else that finishes. The 34
    # full-domain Kani proofs that time out are behind `--cfg kani_full`.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Z3 proofs of the fee maths
        run: |
          python -m venv /tmp/z3
          /tmp/z3/bin/pip install --quiet z3-solver
          /tmp/z3/bin/python programs/pipeline-strategy-interface/proofs/fee_maths_z3.py
      - name: Cache Kani
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
          key: ${{ runner.os }}-kani-0.67.0
      - name: Install Kani
        run: |
          if ! cargo kani --version 2>/dev/null | grep -q "0.67.0"; then
            cargo install --locked kani-verifier --version 0.67.0
          fi
          cargo kani setup
      - name: Kani proofs
        run: cargo kani -p pipeline-strategy-interface -Z unstable-options -Z stubbing -j 4 --output-format=terse

  typescript-sdk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Type-check the strategy template's scripts (against this SDK)
        working-directory: templates/strategy/scripts
        run: |
          npm pkg set "dependencies.@pipeline-sol/sdk=file:../../../sdk/ts"
          npm install --no-audit --no-fund --no-package-lock
          npm run typecheck
