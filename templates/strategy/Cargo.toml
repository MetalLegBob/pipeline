# A Pipeline strategy: the on-chain program in `programs/my-strategy`, with its LiteSVM
# tests in `programs/my-strategy/tests`.
#
#   cargo build-sbf --manifest-path programs/my-strategy/Cargo.toml
#                       builds the program into target/deploy/
#   cargo test          runs the tests against the real router
#
# Build each program by its manifest: a whole-workspace build unifies dependency features
# across programs, which can change a program's bytes.
[workspace]
resolver = "2"
members = ["programs/*"]

[workspace.package]
edition = "2021"

# The Pipeline crates, from crates.io.
[workspace.dependencies]
pipeline-strategy-interface = "0.1"
pipeline-client = "0.1"
pipeline-check = { version = "0.1", default-features = false }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
