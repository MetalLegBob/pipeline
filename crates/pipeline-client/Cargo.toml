[package]
name = "pipeline-client"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Addresses, instruction builders and account decoders for the Pipeline router"
repository = "https://github.com/MetalLegBob/pipeline"
homepage = "https://github.com/MetalLegBob/pipeline"
readme = "README.md"
keywords = ["solana", "pipeline", "amm", "defi", "client"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]

[dependencies]
borsh = { version = "1.5", features = ["derive"] }
pipeline-strategy-interface = { path = "../../programs/pipeline-strategy-interface", version = "0.1.0" }
solana-instruction = "3.5.1"
solana-pubkey = { version = "4.3.0", features = ["borsh", "curve25519", "sha2"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[dev-dependencies]
base64 = "0.22"
pipeline-events = { path = "../pipeline-events", version = "0.1.0" }
spl-token-2022-interface = "3.1.2"
