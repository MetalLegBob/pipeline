[package]
name = "pipeline-check"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Self-service quality checks for Pipeline strategy markets, run in a local Solana VM"

[features]
default = ["rpc"]
# Read-only RPC cloning and the `pipeline-check` command-line tool. Strategy developers
# who only call `check_market` from their own LiteSVM tests can turn this off.
rpc = ["dep:reqwest", "dep:base64"]

[[bin]]
name = "pipeline-check"
path = "src/main.rs"
required-features = ["rpc"]

[dependencies]
base64 = { version = "0.22", optional = true }
bincode = "1"
borsh = { version = "1.5", features = ["derive"] }
litesvm = "=0.18.2"
pipeline-client = { path = "../pipeline-client" }
pipeline-quoter = { path = "../pipeline-quoter" }
pipeline-strategy-interface = { path = "../../programs/pipeline-strategy-interface" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-account = "=4.7.0"
solana-clock = "~3.2.0"
solana-keypair = "=3.1.2"
solana-pubkey = "=4.3.0"
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.3.0", features = ["serde"] }
spl-token-2022-interface = "3.1.2"

